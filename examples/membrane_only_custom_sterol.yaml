membrane_only:
  enabled: true
  box_xy_angstrom:
    - 125.0
    - 125.0

membrane:
  composition:
    upper:
      POPC: 0.85
      POPE: 0.00
      POPS: 0.00
      CHL: 0.10
    lower:
      POPC: 0.85
      POPE: 0.00
      POPS: 0.00
      CHL: 0.10

# AMBMEM currently does not package custom-sterol parameters.
# Replace these placeholder paths with matching user-provided
# MOL2, Amber LIB/OFF, and FRCMOD files.
custom_sterols:
  enabled: true
  species:
    - name: example-sterol
      species_code: CST
      residue_name: CST
      mol2: parameters/custom_sterol.mol2
      library: parameters/custom_sterol.lib
      parameters: parameters/custom_sterol.frcmod
      expected_formal_charge: 0
      fraction: 0.05
      leaflets:
        upper:
          fraction: 0.05
        lower:
          fraction: 0.05
      orientation:
        anchor_atom: O1
        axis_start_atom: O1
        axis_end_atoms:
          - C28
          - C29
        allow_reflection: false
      placement:
        host_species: POPC
        trials_per_site: 240
        xy_offset_angstrom: 3.0
        z_offset_angstrom: 1.5
        require_exact_count: true

ions:
  enabled: true
  salt: KCl
  concentration_molar: 0.15

build:
  seed: 7001

output:
  directory: /absolute/path/to/output
  pdb_name: system_membrane_solvated.pdb
