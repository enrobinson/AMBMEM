protein:
  pdb: /absolute/path/to/oriented_protein.pdb
  preoriented: true
  orientation_source: OPM

topology:
  enabled: true
  solute_prmtop: /absolute/path/to/pre_membrane.prmtop
  solute_coordinates: /absolute/path/to/pre_membrane.rst7
  output_prmtop: topology.prmtop
  output_rst7: coordinates.rst7

membrane:
  composition:
    upper:
      POPC: 0.60
      POPE: 0.10
      POPS: 0.00
      CHL: 0.30
    lower:
      POPC: 0.30
      POPE: 0.25
      POPS: 0.20
      CHL: 0.25

ions:
  enabled: true
  salt: KCl
  concentration_molar: 0.15

build:
  seed: 7001

output:
  directory: /absolute/path/to/output
  pdb_name: system_membrane_solvated.pdb
